video:
  sample_fps: 5
  output_dir: "examples/outputs"

sampling:
  strategy: "fixed_fps"
  save_images: true
  image_format: "jpg"

detection:
  model_name: "yolov8n.pt"
  confidence_threshold: 0.4
  target_classes:
    - person
    # - tree
    - car
    - bicycle
    - bus
    # - motorcycle
    - truck

temporal:
  max_gap_seconds: 1.5
  min_segment_duration_seconds: 1
  min_evidence_frames: 2

events:
  # Level-2 safety event types emitted into safety_event_candidates.json.
  # crowding_or_gathering / long_duration_vehicle_presence are scaffolded but
  # disabled by default; enable here when ready.
  enabled_safety_event_types:
    - person_vehicle_proximity

  risk_categories:
    person_vehicle_proximity: collision_risk
    crowding_or_gathering: crowding_risk
    long_duration_vehicle_presence: operational_risk

  # Interpretable risk scoring (ideas.md section 6).
  scoring:
    weights:
      proximity: 0.4
      duration: 0.3
      confidence: 0.2
      crowding: 0.1
    duration_ref_seconds: 10.0
    crowd_ref_people: 3
    severity_bins:
      low_max: 0.33
      medium_max: 0.66

  vehicle_classes:
    - car
    - bus
    - truck
    - motorcycle
    - bicycle

  min_event_duration_seconds: 0.5
  min_evidence_frames: 2
  person_vehicle_distance_threshold_pixels: 400

# =====================================================================
# Driving / VLA upgrade (Week 1+). The sections below drive the new
# nuScenes -> perception -> tracking -> geometry -> reasoning -> eval
# pipeline. Legacy warehouse sections above are kept for reference while
# the migration is in progress and will be pruned once the pivot lands.
# =====================================================================

dataset:
  name: nuscenes
  version: "v1.0-mini"             # mini split for local dev
  dataroot: "data/nuscenes"        # where you extracted the mini archive
  camera: "CAM_FRONT"              # camera channel used for detection + VLM
  # nuScenes category_name -> coarse agent class we reason about.
  category_map:
    "human.pedestrian.adult": person
    "human.pedestrian.child": person
    "human.pedestrian.construction_worker": person
    "human.pedestrian.police_officer": person
    "vehicle.car": car
    "vehicle.truck": truck
    "vehicle.bus.rigid": bus
    "vehicle.bus.bendy": bus
    "vehicle.bicycle": bicycle
    "vehicle.motorcycle": motorcycle

tracking:
  # Tracking-by-detection over YOLO boxes (src/tracker.py).
  iou_threshold: 0.3               # min IoU to associate a detection to a track
  max_age: 5                       # frames a track survives unmatched before death
  min_hits: 3                      # matched frames before a track is "confirmed"
  association: greedy              # greedy | hungarian

geometry:
  # Ego-relative kinematics + criticality (src/geometry.py, src/scene_state.py).
  ttc_max_seconds: 10.0            # cap TTC; agents beyond this are "not converging"
  ego_path_half_width_m: 1.5       # lateral half-width of the ego corridor
  zone_front_fov_deg: 60.0         # angular width of the "ahead" zone
  bev_range_m: 50.0                # +/- range of the BEV plot
  criticality:                     # reuse of the interpretable-score idea
    weights:
      ttc: 0.5                     # lower TTC -> higher criticality
      in_path: 0.3                 # agent inside ego corridor
      proximity: 0.2               # closer -> higher
    ttc_ref_seconds: 6.0
    distance_ref_m: 30.0

prediction:
  horizon_seconds: 3.0             # how far ahead to predict / evaluate
  future_steps: 6                  # nuScenes keyframes are 2 Hz -> 6 steps = 3 s

eval:
  iou_match_threshold: 0.5         # detection<->GT match for tracking eval
  calibration_bins: 10             # reliability-diagram bins
  output_dir: "examples/outputs/eval"

vlm:
  mode: mock                       # mock | api
  business_context: "autonomous-driving scene understanding (perception / prediction / planning reasoning)"
  max_evidence_frames: 3
  api:
    provider: dashscope
    # The endpoint is resolved from the account region (read from DASHSCOPE_REGION):
    #   ap-southeast-1 -> https://dashscope-intl.aliyuncs.com/compatible-mode/v1 (Singapore / international)
    #   cn-beijing     -> https://dashscope.aliyuncs.com/compatible-mode/v1      (Beijing / China)
    region_env: "DASHSCOPE_REGION"
    # base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"  # optional explicit override
    workspace_id_env: "DASHSCOPE_WORKSPACE_ID"   # optional; sent as a header only if set
    model: "qwen3-vl-flash"
    api_key_env: "DASHSCOPE_API_KEY"
    temperature: 0.2
    max_tokens: 800
